{
  "$schema": "../schemas/agent.schema.json",
  "schema_version": "0.4",
  "agent_id": "AGENT-VERIFIER-01",
  "name": "verifier-01",
  "role": "tester",
  "runtime": {
    "provider": "codex",
    "executable": "codex",
    "version": { "minimum": "0.149" },
    "requirements": {
      "runtime_mode": "local",
      "capabilities": ["agent-skill-v1", "execution-manifest-v1", "local-worktree-v1", "rpc-v1", "skill-bundles-v1"],
      "model_strategy": "runtime_default"
    }
  },
  "skills": ["repository-analysis", "run-verification", "analyze-test-failure"],
  "dependencies": { "system": ["git", "docker"], "optional": [] },
  "authentication": { "required": ["codex", "github"] },
  "health_checks": ["codex_cli", "github", "repository_access"],
  "responsibilities": ["Independently verify candidate implementations."],
  "forbidden_actions": ["Modify the implementation under verification."],
  "inputs": ["engineering_task", "integration_result", "repository"],
  "outputs": ["verification_result", "finding", "evidence_bundle"]
}
