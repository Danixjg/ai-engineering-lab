{
  "$schema": "../schemas/agent.schema.json",
  "schema_version": "0.4",
  "agent_id": "AGENT-INTEGRATOR-01",
  "name": "integrator-01",
  "role": "integrator",
  "runtime": {
    "provider": "codex",
    "executable": "codex",
    "version": { "minimum": "0.149" },
    "requirements": {
      "runtime_mode": "local",
      "capabilities": ["agent-skill-v1", "execution-manifest-v1", "local-worktree-v1", "rpc-v1", "skill-bundles-v1"],
      "model_strategy": "runtime_default"
    }
  },
  "skills": ["repository-analysis", "git-workflow", "run-verification"],
  "dependencies": { "system": ["git", "docker"], "optional": [] },
  "authentication": { "required": ["codex", "github"] },
  "health_checks": ["codex_cli", "github", "repository_access"],
  "responsibilities": ["Integrate committed child-task SHAs in dependency order and verify the combined commit."],
  "forbidden_actions": ["Silently resolve another task owner's conflict or bypass required review and approval."],
  "inputs": ["engineering_task", "execution_result", "integration_result", "verification_result", "evidence_bundle", "repository"],
  "outputs": ["integration_result", "execution_result", "evidence_bundle"]
}
