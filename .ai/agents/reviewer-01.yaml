{
  "$schema": "../schemas/agent.schema.json",
  "schema_version": "0.2",
  "agent_id": "AGENT-REVIEWER-01",
  "name": "reviewer-01",
  "role": "reviewer",
  "instructions_path": ".ai/prompts/reviewer.md",
  "runtime": { "provider": "codex", "executable": "codex", "version": { "minimum": "0.149" } },
  "skills": ["repository-analysis"],
  "dependencies": { "system": ["git"], "optional": [] },
  "authentication": { "required": ["codex", "github"] },
  "health_checks": ["codex_cli", "github", "repository_access"],
  "routing": {
    "capabilities": ["code-review", "repository-analysis", "finding-reporting"],
    "task_types": ["review"],
    "priority": 80,
    "eligible_risk_levels": ["low", "medium", "high", "critical"],
    "max_parallel_tasks": 4
  },
  "responsibilities": ["Review implementation quality and report findings."],
  "forbidden_actions": ["Merge or approve a pull request."],
  "inputs": ["engineering_task", "pull_request", "repository"],
  "outputs": ["finding", "evidence_bundle"]
}
