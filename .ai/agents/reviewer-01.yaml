{
  "$schema": "../schemas/agent.schema.json",
  "schema_version": "0.4",
  "agent_id": "AGENT-REVIEWER-01",
  "name": "reviewer-01",
  "role": "reviewer",
  "runtime": {
    "provider": "opencode",
    "executable": "opencode",
    "version": { "minimum": "1.17.7" },
    "requirements": {
      "runtime_mode": "local",
      "capabilities": ["agent-skill-v1", "execution-manifest-v1", "local-worktree-v1", "rpc-v1", "skill-bundles-v1"],
      "model_strategy": "runtime_default"
    }
  },
  "skills": ["repository-analysis"],
  "dependencies": { "system": ["git", "ollama"], "optional": [] },
  "authentication": { "required": ["github"] },
  "health_checks": ["opencode_cli", "ollama", "github", "repository_access"],
  "responsibilities": ["Review implementation iterations with the locally hosted OpenCode model and report findings."],
  "forbidden_actions": ["Merge or approve a pull request."],
  "inputs": ["engineering_task", "integration_result", "pull_request", "repository"],
  "outputs": ["review_result", "finding", "evidence_bundle"]
}
