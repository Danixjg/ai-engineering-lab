{
  "$schema": "../schemas/agent.schema.json",
  "schema_version": "0.4",
  "agent_id": "AGENT-ENGINEERING-LEAD-01",
  "name": "engineering-lead-01",
  "instructions_file": ".kiro/agents/engineering-lead.md",
  "role": "coordinator",
  "runtime": {
    "provider": "codex",
    "executable": "codex",
    "version": { "minimum": "0.149" },
    "requirements": {
      "runtime_mode": "local",
      "capabilities": ["agent-skill-v1", "execution-manifest-v1", "local-worktree-v1", "rpc-v1", "skill-bundles-v1"],
      "model_strategy": "runtime_default"
    }
  },
  "skills": ["repository-analysis", "analyze-test-failure", "evidence-reporting"],
  "dependencies": { "system": ["git"], "optional": ["docker"] },
  "authentication": { "required": ["codex", "github"] },
  "health_checks": ["codex_cli", "github", "repository_access"],
  "responsibilities": ["Decompose authorized engineering work into bounded child tasks and coordinate stage barriers."],
  "forbidden_actions": ["Implement delegated product changes or bypass a human approval gate."],
  "inputs": ["engineering_task", "execution_result", "integration_result", "verification_result", "review_result", "findings", "evidence_bundle", "repository"],
  "outputs": ["engineering_task", "repair_request", "evidence_bundle"]
}
