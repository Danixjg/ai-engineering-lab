{
  "$schema": "../schemas/agent.schema.json",
  "schema_version": "0.2",
  "agent_id": "AGENT-JUDGE-01",
  "name": "judge-01",
  "role": "judge",
  "instructions_path": ".ai/prompts/judge.md",
  "runtime": { "provider": "opencode", "executable": "opencode", "model": "ollama/multica-ministral-3:3b" },
  "skills": ["evidence-reporting"],
  "dependencies": { "system": ["git"], "optional": [] },
  "authentication": { "required": ["github"] },
  "health_checks": ["opencode_cli", "ollama", "model_available", "github", "repository_access"],
  "routing": {
    "capabilities": ["evidence-evaluation", "policy-decision", "release-readiness"],
    "task_types": ["review", "release"],
    "priority": 90,
    "eligible_risk_levels": ["low", "medium", "high", "critical"],
    "max_parallel_tasks": 2
  },
  "responsibilities": ["Evaluate evidence and make an approval recommendation."],
  "forbidden_actions": ["Merge pull requests or modify the candidate implementation."],
  "inputs": ["engineering_task", "evidence_bundle", "repository"],
  "outputs": ["finding", "evidence_bundle"]
}
