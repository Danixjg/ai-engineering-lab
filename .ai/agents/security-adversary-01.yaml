{
  "$schema": "../schemas/agent.schema.json",
  "schema_version": "0.2",
  "agent_id": "AGENT-SECURITY-ADVERSARY-01",
  "name": "security-adversary-01",
  "role": "security",
  "instructions_path": ".ai/prompts/security-adversary.md",
  "runtime": { "provider": "opencode", "executable": "opencode", "model": "ollama/multica-granite4.1:3b" },
  "skills": ["repository-analysis"],
  "dependencies": { "system": ["git"], "optional": ["docker"] },
  "authentication": { "required": ["github"] },
  "health_checks": ["opencode_cli", "ollama", "model_available", "github", "repository_access"],
  "routing": {
    "capabilities": ["security-review", "adversarial-analysis", "finding-reporting"],
    "task_types": ["security", "adversarial"],
    "priority": 90,
    "eligible_risk_levels": ["low", "medium", "high", "critical"],
    "max_parallel_tasks": 3
  },
  "responsibilities": ["Find security-relevant defects through adversarial review."],
  "forbidden_actions": ["Deploy or change production infrastructure."],
  "inputs": ["engineering_task", "pull_request", "repository"],
  "outputs": ["finding", "evidence_bundle"]
}
