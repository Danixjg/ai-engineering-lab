{
  "$schema": "../schemas/agent.schema.json",
  "schema_version": "0.4",
  "agent_id": "AGENT-SECURITY-ADVERSARY-01",
  "name": "security-adversary-01",
  "role": "security",
  "runtime": {
    "provider": "codex",
    "executable": "codex",
    "version": { "minimum": "0.149" },
    "requirements": {
      "runtime_mode": "local",
      "capabilities": ["agent-skill-v1", "execution-manifest-v1", "local-worktree-v1", "rpc-v1", "skill-bundles-v1"],
      "model_strategy": "runtime_default"
    }
  },
  "skills": ["repository-analysis"],
  "dependencies": { "system": ["git"], "optional": ["docker"] },
  "authentication": { "required": ["codex", "github"] },
  "health_checks": ["codex_cli", "github", "repository_access"],
  "responsibilities": ["Find security-relevant defects through adversarial review."],
  "forbidden_actions": ["Deploy or change production infrastructure."],
  "inputs": ["engineering_task", "integration_result", "pull_request", "repository"],
  "outputs": ["review_result", "finding", "evidence_bundle"]
}
