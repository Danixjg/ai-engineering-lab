version: "0.2"

max_attempts: 3

on_failure:

  retryable:
    - test_failure
    - build_failure
    - type_check_failure
    - lint_failure
    - acceptance_criterion_failure
    - integration_conflict
    - code_review_failure

  non_retryable:
    - security_failure
    - production_access_required
    - permission_failure
    - destructive_change_required

routing:
  planning_owner: engineering-lead
  implementation_owner: original-builder
  integration_conflict_owner: conflicting-task-owner
  security_owner: human

retry:
  preserve_original_task: true
  preserve_acceptance_criteria: true
  preserve_failed_tests: true

stop_conditions:
  - max_attempts_reached
  - non_retryable_failure
  - human_intervention_required
  - verification_environment_unavailable

final_states:

  after_success:
    status: integration

  after_max_attempts:
    status: needs_human

  after_non_retryable_failure:
    status: needs_human
