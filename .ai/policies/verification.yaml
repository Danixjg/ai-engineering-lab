version: "0.2"

defaults:
  blocking: true

checks:

  build:
    required: true
    blocking: true

  unit_tests:
    required: true
    blocking: true

  integration_tests:
    required: false
    blocking: true

  type_check:
    required: true
    blocking: true

  lint:
    required: true
    blocking: false

  format:
    required: true
    blocking: false

  security:
    required: true
    blocking: true

  dependency:
    required: true
    blocking: false

  code_review:
    required: true
    blocking: true

  integrated_commit_security_review:
    required: true
    blocking: true

independence:
  same_candidate_sha: true
  required_roles:
    - verifier
    - reviewer
    - security-adversary
  barrier: all_terminal

acceptance_criteria:
  all_required: true

decision:
  pass_when:
    - all_required_checks_pass
    - all_required_acceptance_criteria_pass
    - no_blocking_findings
    - all_independent_reviews_reference_same_candidate_sha
