# This file is the compatibility contract for every machine that runs a
# Multica worker for this repository.  Keep credentials, URLs, workspace IDs,
# and executable paths in the worker's protected local configuration.
worker:
  multica: required
  daemon: required

agents:
  kiro:
    required: false
    command: kiro-cli
    version: "2.0"
    auth: required
  codex:
    required: true
    command: codex
    version: "0.149"
    auth: required
  opencode:
    required: true
    command: opencode
    version: "1.17.7"
    auth: none
    model_host: ollama

tools:
  git: required
  docker: required
  ollama: required

languages:
  python: "3.12"
  node: "24"
